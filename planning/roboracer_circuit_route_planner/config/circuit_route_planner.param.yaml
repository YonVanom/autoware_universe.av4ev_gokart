/**:
  ros__parameters:
    # How far ahead (in meters) to plan the route window.
    # On a loop circuit, keep this shorter than the circuit length to avoid
    # the window wrapping all the way around and stopping prematurely.
    lookahead_distance_m: 30.0

    # Number of lanelets behind the car to include in the route window.
    # These "already-driven" lanelets give the behavior_path_planner a backward overlap so that
    # current_route_lanelet_ (which lags one step behind the car's actual position) is always
    # within the published route. Without this, the planner loses its reference lanelet each
    # time the window shifts forward and emits "lanelet_sequence is empty".
    backward_lanelets_num: 2
