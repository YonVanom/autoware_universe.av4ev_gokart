launch:
- arg:
    name: control_cmd_topic
    default: /control/command/control_cmd
- arg:
    name: odom_topic
    default: /ego/odom
- arg:
    name: drive_topic
    default: /ego/drive
- arg:
    name: ackermann_cmd_topic
    default: /ackermann_cmd
- arg:
    name: joy_topic
    default: /joy
- arg:
    name: control_mode_report_topic
    default: /vehicle/status/control_mode
- arg:
    name: steering_status_topic
    default: /vehicle/status/steering_status
- arg:
    name: velocity_status_topic
    default: /vehicle/status/velocity_status
- arg:
    name: steering_report_rate_hz
    default: "30.0"
    description: Rate at which the steering status report is published [Hz].
- arg:
    name: moving_average_window
    default: "10"
    description: Number of odom samples to average for velocity smoothing.
- arg:
    name: longitudinal_decimal_places
    default: "1"
    description: Decimal places to round filtered longitudinal velocity to. -1 disables rounding.
- arg:
    name: lateral_decimal_places
    default: "2"
    description: Decimal places to round filtered lateral velocity to. -1 disables rounding.
- arg:
    name: heading_rate_decimal_places
    default: "3"
    description: Decimal places to round filtered heading rate to. -1 disables rounding.
- arg:
    name: autonomous_button
    default: "6"
    description: Joy button index that activates AUTONOMOUS mode.
- arg:
    name: manual_button
    default: "7"
    description: Joy button index that activates MANUAL mode.
- node:
    pkg: roboracer_interface
    exec: roboracer_interface_node
    name: roboracer_interface_node
    output: screen
    remap:
      - from: control/command/control_cmd
        to: $(var control_cmd_topic)
      - from: ego/odom
        to: $(var odom_topic)
      - from: ego/drive
        to: $(var drive_topic)
      - from: ackermann_cmd
        to: $(var ackermann_cmd_topic)
      - from: joy
        to: $(var joy_topic)
      - from: vehicle/status/control_mode
        to: $(var control_mode_report_topic)
      - from: vehicle/status/steering_status
        to: $(var steering_status_topic)
      - from: vehicle/status/velocity_status
        to: $(var velocity_status_topic)
    param:
      - name: steering_report_rate_hz
        value: $(var steering_report_rate_hz)
      - name: moving_average_window
        value: $(var moving_average_window)
      - name: longitudinal_decimal_places
        value: $(var longitudinal_decimal_places)
      - name: lateral_decimal_places
        value: $(var lateral_decimal_places)
      - name: heading_rate_decimal_places
        value: $(var heading_rate_decimal_places)
      - name: autonomous_button
        value: $(var autonomous_button)
      - name: manual_button
        value: $(var manual_button)
